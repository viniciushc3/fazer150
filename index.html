<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Motolog mudou de endereço</title>
<link rel="canonical" href="https://motologapp.github.io/">
<meta http-equiv="refresh" content="0; url=https://motologapp.github.io/">
<style>body{margin:0;min-height:100vh;display:grid;place-items:center;background:#10151c;color:#e8edf3;font:16px system-ui,sans-serif;text-align:center;padding:16px}a{color:#f5a524}</style>
</head><body>
<p>O Motolog mudou para <a href="https://motologapp.github.io/">motologapp.github.io</a>.<br>Abrindo o novo endereço...</p>
<script>
if ('serviceWorker' in navigator) navigator.serviceWorker.getRegistrations().then(rs => rs.forEach(r => r.unregister())).catch(() => {});
location.replace('https://motologapp.github.io/' + location.search + location.hash);
</script>
</body></html>
